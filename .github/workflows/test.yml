name: Run tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: ['*']

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint (black + flake8)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install Mu with dev dependencies
        run: pip install .[dev]
      - name: black
        run: python make.py black
      - name: flake8
        run: python make.py flake8

  test:
    timeout-minutes: 30
    strategy:
      matrix:
        # ubuntu-24.04-arm is native ARM64 (closest CI match for a 64-bit
        # Raspberry Pi running a current OS); macos-latest is Apple Silicon.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Test Py ${{ matrix.python-version }} - ${{ matrix.os }}
    env:
      # Qt renders without a display server; no xvfb needed.
      QT_QPA_PLATFORM: offscreen
      LANG: en_GB.UTF-8
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python info
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8)"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0
      - name: Install Mu dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[tests]
          pip list
        timeout-minutes: 10
      - name: Run tests with coverage
        run: python make.py coverage
        timeout-minutes: 10

  test-debian-apt-qt:
    # Raspberry Pi OS (Bookworm) and 32-bit Pis have no PyQt6 wheels on PyPI,
    # so there Mu uses Debian's packaged PyQt6. Test that combination.
    runs-on: ubuntu-latest
    container: debian:trixie
    name: Test Debian trixie + apt PyQt6
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Install system Python and PyQt6
        run: |
          apt-get update
          apt-get install -y git python3 python3-venv python3-pip \
            python3-pyqt6 python3-pyqt6.qsci python3-pyqt6.qtcharts \
            python3-pyqt6.qtserialport python3-pyqt6.qtsvg
      - uses: actions/checkout@v4
      - name: Install Mu (reusing the system PyQt6)
        run: |
          python3 -m venv --system-site-packages .venv
          . .venv/bin/activate
          # Install Mu's non-Qt dependencies only, so pip can't replace the
          # distro's PyQt6 with a PyPI wheel.
          python utils/non_qt_requirements.py tests > /tmp/requirements.txt
          cat /tmp/requirements.txt
          pip install -r /tmp/requirements.txt
          pip install --no-deps .
          pip list
          python -c "import PyQt6.QtCore as q; print('Qt', q.QT_VERSION_STR, q.__file__)"
      - name: Run tests
        run: |
          . .venv/bin/activate
          python -m pytest tests
