name: Build Mu

on:
  push:
    branches: ['master', 'main']
  pull_request:
    branches: ['*']

env:
  PYTHON_VERSION: '3.14'
  # Used by make.py to query python-build-standalone releases without
  # hitting GitHub's anonymous API rate limit.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  QT_QPA_PLATFORM: offscreen

jobs:
  build:
    strategy:
      matrix:
        # macos-latest is Apple Silicon (arm64).
        os: [macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Display Python info
        run: |
          python -c "import sys; print(sys.version)"
          python -c "import platform, struct; print(platform.machine(), struct.calcsize('P') * 8)"
          python make.py pbs_url
      - name: Install Mu test dependencies
        run: |
          pip install .[dev]
          pip list
      - run: mkdir upload
      - name: Build Windows 64 bit
        if: runner.os == 'Windows'
        run: |
          python make.py win64
          dir dist/*.msi | rename-item -newname {  $_.name  -replace ".msi"," (64 bit).msi"  }
          mv dist/*.msi upload/
      - name: Build macOS
        if: runner.os == 'macOS'
        run: |
          make macos
          mv dist/*.dmg upload/
      - name: Upload Mu installer
        uses: actions/upload-artifact@v4
        with:
          name: mu-editor-${{ runner.os }}-${{ github.sha }}
          path: upload

  build-linux:
    # Build on the oldest supported Ubuntu so the AppImage runs on as many
    # distributions as possible (PyQt6 wheels need glibc 2.28+).
    runs-on: ubuntu-22.04
    name: Build AppImage
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 file desktop-file-utils
      - name: Install Mu test dependencies
        run: |
          pip install .[dev]
          pip list
      - name: Build Linux AppImage
        run: make linux
      # GitHub actions upload artifact breaks permissions, workaround using tar
      # https://github.com/actions/upload-artifact/issues/38
      - name: Tar AppImage to maintain permissions
        run: |
          cd dist/
          tar -cvf Mu_Editor-AppImage-x86_64-${{ github.sha }}.tar *.AppImage
          ls -la .
      - name: Upload Mu AppImage
        uses: actions/upload-artifact@v4
        with:
          name: mu-editor-${{ runner.os }}-${{ github.sha }}
          path: dist/Mu_Editor-AppImage-x86_64-${{ github.sha }}.tar
